[package]
name = "combo_search"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
js-sys = "0.3"

[profile.release]
opt-level = "z"
codegen-units = 1
lto = true
strip = true
panic = "abort"
overflow-checks = false
debug-assertions = false

[profile.release.package.combo_search]
opt-level = 3

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

